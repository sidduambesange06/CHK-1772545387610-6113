<!DOCTYPE html>
<html>
<head>
    <title>Login - DeepScan</title>
    <style>
        body{font-family:Arial;background:#1a1a1a;margin:0;display:flex;justify-content:center;align-items:center;height:100vh}
        .box{background:#fff;padding:40px;border-radius:8px;width:350px}
        h1{color:#2c3e50;margin:0 0 30px 0;text-align:center}
        label{display:block;color:#333;margin:15px 0 5px}
        input{width:100%;padding:10px;border:1px solid #ddd;border-radius:4px;box-sizing:border-box}
        button{width:100%;background:#2c3e50;color:#fff;border:none;padding:12px;border-radius:4px;margin-top:20px;cursor:pointer}
        button:hover{background:#1a252f}
        .footer{text-align:center;margin-top:20px;color:#999;font-size:12px}
    </style>
</head>
<body>
    <div class="box">
        <h1>DeepScan</h1>
        <form onsubmit="event.preventDefault();location.href='index.html'">
            <label>Username</label>
            <input type="text" required>
            <label>Password</label>
            <input type="password" required>
            <button>Login</button>
        </form>
        <div class="footer">CHAKRAVYUH 2.0</div>
    </div>
</body>
</html>
