<!DOCTYPE html>
<html>
<head>
    <title>DeepScan - Upload</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #1a1a1a;
        }
        .navbar {
            background: #2c3e50;
            color: white;
            padding: 14px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar h2 {
            margin: 0;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }
        .container {
            max-width: 700px;
            margin: 60px auto;
            text-align: center;
        }
        h1 {
            color: #ffffff;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }
        p.desc {
            color: #e0e0e0;
            margin-bottom: 40px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.7);
        }
        .upload-box {
            border: 2px dashed #aaa;
            border-radius: 8px;
            padding: 50px 20px;
            background: rgba(255, 255, 255, 0.95);
            cursor: pointer;
        }
        .upload-box:hover {
            border-color: #2c3e50;
        }
        .upload-icon {
            font-size: 48px;
            color: #999;
        }
        .upload-box p {
            color: #777;
            margin-top: 10px;
        }
        .upload-box small {
            color: #aaa;
        }
        .btn {
            background: #2c3e50;
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 16px;
            border-radius: 5px;
            margin-top: 25px;
            cursor: pointer;
        }
        .btn:hover {
            background: #1a252f;
        }
        .options {
            margin-top: 30px;
            text-align: left;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 25px;
            border-radius: 8px;
        }
        .options h3 {
            margin-top: 0;
            color: #2c3e50;
        }
        .options label {
            display: block;
            margin: 8px 0;
            color: #444;
        }
        .footer {
            text-align: center;
            padding: 20px;
            color: #999;
            margin-top: 50px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h2>DeepScan</h2>
        <div class="nav-links">
            <a href="upload.html">Upload</a>
            <a href="results.html">Results</a>
        </div>
    </div>
    <div class="container">
        <h1>Upload Media for Analysis</h1>
        <p class="desc">Upload an image, video or audio file to check for deepfake manipulation.</p>
        <div class="upload-box">
            <div class="upload-icon">&#128228;</div>
            <p>Drag & drop your file here</p>
            <small>or click to browse (jpg, png, mp4, wav)</small>
        </div>
        <div class="options">
            <h3>Detection Type</h3>
            <label><input type="checkbox" checked> Image Deepfake Detection</label>
            <label><input type="checkbox"> Video Manipulation Check</label>
            <label><input type="checkbox"> Audio Synthesis Detection</label>
        </div>
        <a href="results.html"><button class="btn">Analyze File</button></a>
    </div>
    <div class="footer">DeepScan &copy; </div>
</body>
</html>
