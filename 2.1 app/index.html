<!DOCTYPE html>
<html>
<head>
    <title>DeepScan - Upload</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #1a1a1a;
        }
        .navbar {
            background: #2c3e50;
            color: white;
            padding: 14px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar h2 {
            margin: 0;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }
        .container {
            max-width: 700px;
            margin: 60px auto;
            text-align: center;
        }
        h1 {
            color: #ffffff;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }
        p.desc {
            color: #e0e0e0;
            margin-bottom: 40px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.7);
        }
        .upload-box {
            border: 2px dashed #aaa;
            border-radius: 8px;
            padding: 50px 20px;
            background: rgba(255, 255, 255, 0.95);
            cursor: pointer;
            transition: border-color 0.3s;
        }
        .upload-box.dragover {
            border-color: #2c3e50;
            background: rgba(44, 62, 80, 0.1);
        }
        .file-name {
            margin-top: 15px;
            color: #2c3e50;
            font-weight: bold;
        }
        input[type="file"] {
            display: none;
        }
        .upload-box:hover {
            border-color: #2c3e50;
        }
        .upload-icon {
            font-size: 48px;
            color: #999;
        }
        .upload-box p {
            color: #777;
            margin-top: 10px;
        }
        .upload-box small {
            color: #aaa;
        }
        .btn {
            background: #2c3e50;
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 16px;
            border-radius: 5px;
            margin-top: 25px;
            cursor: pointer;
        }
        .btn:hover {
            background: #1a252f;
        }
        .options {
            margin-top: 30px;
            text-align: left;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 25px;
            border-radius: 8px;
        }
        .options h3 {
            margin-top: 0;
            color: #2c3e50;
        }
        .options label {
            display: block;
            margin: 8px 0;
            color: #444;
        }
        .footer {
            text-align: center;
            padding: 20px;
            color: #999;
            margin-top: 50px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h2><a href="index.html" style="color: white; text-decoration: none;">DeepScan</a></h2>
        <div class="nav-links">
            <a href="index.html">Upload</a>
            <a href="results.html">Results</a>
            <a href="login.html">Logout</a>
        </div>
    </div>
    <div class="container">
        <h1>Upload Media for Analysis</h1>
        <p class="desc">Upload an image, video or audio file to check for deepfake manipulation.</p>
        <div class="upload-box" id="uploadBox" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon">&#128228;</div>
            <p>Drag & drop your file here</p>
            <small>or click to browse (jpg, png, mp4, wav)</small>
            <div class="file-name" id="fileName"></div>
        </div>
        <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.mp4,.wav" />
        <div class="options">
            <h3>Detection Type</h3>
            <label><input type="checkbox" checked> Image Deepfake Detection</label>
            <label><input type="checkbox"> Video Manipulation Check</label>
            <label><input type="checkbox"> Audio Synthesis Detection</label>
        </div>
        <a href="results.html"><button class="btn">Analyze File</button></a>
    </div>
    <div class="footer">DeepScan &copy; 2026 | CHAKRAVYUH 2.0</div>
    <script>
        const uploadBox = document.getElementById('uploadBox');
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');

        uploadBox.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadBox.classList.add('dragover');
        });

        uploadBox.addEventListener('dragleave', () => {
            uploadBox.classList.remove('dragover');
        });

        uploadBox.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadBox.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            const validTypes = ['image/jpeg', 'image/png', 'video/mp4', 'audio/wav'];
            if (validTypes.includes(file.type)) {
                fileName.textContent = `Selected: ${file.name}`;
            } else {
                fileName.textContent = 'Invalid file type. Please upload jpg, png, mp4, or wav.';
            }
        }
    </script>
</body>
</html>
