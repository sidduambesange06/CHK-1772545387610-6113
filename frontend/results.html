<!DOCTYPE html>
<html>
<head>
    <title>DeepScan - Results</title>
    <style>
        body { font-family: Arial; background: #111; color: #eee; margin: 0; }
        .top {
            background: #2c3e50; padding: 14px 30px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .top h2 { margin: 0; }
        .top a { color: white; text-decoration: none; margin-left: 20px; }
        .main { max-width: 860px; margin: auto; padding: 20px; }

        .verdict-banner {
            padding: 20px 25px; border-radius: 8px; margin-bottom: 20px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .verdict-banner.manipulated { background: rgba(239,68,68,0.15); border: 1px solid #ef4444; }
        .verdict-banner.authentic   { background: rgba(34,197,94,0.15);  border: 1px solid #22c55e; }
        .verdict-label { font-size: 28px; font-weight: bold; }
        .verdict-label.manipulated { color: #ef4444; }
        .verdict-label.authentic   { color: #22c55e; }
        .verdict-meta { font-size: 13px; color: #aaa; text-align: right; }

        .preview {
            height: 220px; background: #000; border: 1px solid #333;
            display: flex; align-items: center; justify-content: center;
            border-radius: 6px; overflow: hidden; margin-bottom: 20px;
        }
        .preview img, .preview video, .preview audio { max-height: 100%; max-width: 100%; }

        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        .card {
            background: #1e1e1e; border: 1px solid #333;
            padding: 16px; border-radius: 6px;
        }
        .card h3 { margin: 0 0 12px; font-size: 14px; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; }
        .score-big { font-size: 36px; font-weight: bold; margin: 4px 0; }
        .bar { height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin: 8px 0; }
        .bar-fill { height: 100%; border-radius: 4px; transition: width 1s ease; }
        .bar-fill.red  { background: #ef4444; }
        .bar-fill.green{ background: #22c55e; }
        .bar-fill.blue { background: #3b82f6; }
        .bar-fill.orange{ background: #f59e0b; }

        .tag {
            display: inline-block; padding: 3px 8px; border-radius: 4px;
            font-size: 12px; margin: 3px 2px;
            background: rgba(239,68,68,0.2); color: #ef4444; border: 1px solid #ef4444;
        }
        .tag.ok { background: rgba(34,197,94,0.2); color: #22c55e; border-color: #22c55e; }

        .hash-box {
            font-family: monospace; font-size: 11px; color: #aaa;
            background: #0a0a0a; padding: 10px; border-radius: 4px;
            word-break: break-all; margin-top: 6px;
        }

        .heatmap-img {
            width: 100%; border-radius: 4px; margin-top: 8px;
            image-rendering: pixelated;
        }

        .actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
        .btn {
            padding: 10px 20px; border: none; border-radius: 5px;
            cursor: pointer; font-size: 14px; font-weight: bold;
        }
        .btn-primary { background: #2c3e50; color: white; }
        .btn-primary:hover { background: #1a252f; }
        .btn-success { background: #22c55e; color: #111; }
        .btn-success:hover { background: #16a34a; }
        .btn-outline { background: transparent; color: #aaa; border: 1px solid #444; }
        .btn-outline:hover { border-color: #aaa; color: white; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .summary-box {
            background: #1e1e1e; border: 1px solid #333; padding: 16px;
            border-radius: 6px; margin-top: 16px; font-size: 13px;
            line-height: 1.7; color: #ccc; white-space: pre-wrap;
        }

        .no-data { color: #555; text-align: center; padding: 40px; }
        .stat-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #2a2a2a; font-size: 13px; }
        .stat-row:last-child { border-bottom: none; }
        .stat-label { color: #888; }
        .stat-val { color: #eee; font-weight: bold; }
    </style>
</head>
<body>
    <div class="top">
        <h2><a href="index.html" style="color:white;text-decoration:none;">DeepScan</a></h2>
        <div>
            <a href="index.html">Upload</a>
            <a href="results.html">Results</a>
            <a href="login.html">Logout</a>
        </div>
    </div>

    <div class="main" id="main">
        <div class="no-data" id="noData">No results yet. <a href="index.html" style="color:#3b82f6;">Upload a file</a> to analyze.</div>
    </div>

    <script>
        const raw = localStorage.getItem('scanResult')
        if (!raw) {
            document.getElementById('noData').style.display = 'block'
        } else {
            const d = JSON.parse(raw)
            document.getElementById('noData').style.display = 'none'
            renderResults(d)
        }

        function renderResults(d) {
            const isManipulated = d.label === 'MANIPULATED'
            const scoreColor = isManipulated ? 'red' : 'green'
            const verdictClass = isManipulated ? 'manipulated' : 'authentic'
            const media = d.mediaType || 'image'

            let html = ''

            // verdict banner
            html += `
            <div class="verdict-banner ${verdictClass}">
                <div>
                    <div style="font-size:13px;color:#aaa;margin-bottom:4px;">VERDICT</div>
                    <div class="verdict-label ${verdictClass}">${d.label}</div>
                    <div style="font-size:13px;margin-top:4px;">${media.toUpperCase()} · ${d.confidence?.toFixed(1)}% confidence</div>
                </div>
                <div class="verdict-meta">
                    <div>${d.originalName || 'Unknown file'}</div>
                    <div>${new Date(d.timestamp * 1000).toLocaleString()}</div>
                    <div style="margin-top:4px;font-size:11px;">Case: ${d.fileId?.slice(0,8) || '—'}</div>
                </div>
            </div>`

            // score cards
            html += `<div class="grid2">`

            // manipulation score
            html += `
            <div class="card">
                <h3>Manipulation Score</h3>
                <div class="score-big" style="color:${isManipulated ? '#ef4444' : '#22c55e'}">${d.score?.toFixed(1)}%</div>
                <div class="bar"><div class="bar-fill ${scoreColor}" style="width:${d.score}%"></div></div>
                <div style="font-size:12px;color:#888;">threshold: 25% | verdict: ${d.label}</div>
            </div>`

            // model score (image only)
            if (media === 'image' && d.modelScore !== undefined && d.modelScore !== null) {
                html += `
                <div class="card">
                    <h3>AI Model Score</h3>
                    <div class="score-big" style="color:#3b82f6">${d.modelScore?.toFixed(1)}%</div>
                    <div class="bar"><div class="bar-fill blue" style="width:${d.modelScore}%"></div></div>
                    <div style="font-size:12px;color:#888;">dima806 deepfake detector · 60% weight</div>
                </div>`
            }

            // ELA score (image)
            if (media === 'image') {
                html += `
                <div class="card">
                    <h3>ELA Score</h3>
                    <div class="score-big" style="color:#f59e0b">${d.elaScore?.toFixed(1)}%</div>
                    <div class="bar"><div class="bar-fill orange" style="width:${d.elaScore}%"></div></div>
                    <div style="font-size:12px;color:#888;">Error Level Analysis · 25% weight</div>
                </div>`
            }

            // video stats
            if (media === 'video') {
                const flagRatio = d.framesChecked ? ((d.framesFlagged / d.framesChecked) * 100).toFixed(1) : 0
                html += `
                <div class="card">
                    <h3>Frame Analysis</h3>
                    <div class="score-big" style="color:#f59e0b">${flagRatio}%</div>
                    <div class="bar"><div class="bar-fill orange" style="width:${flagRatio}%"></div></div>
                    <div style="font-size:12px;color:#888;">${d.framesFlagged} of ${d.framesChecked} frames flagged (${d.totalFrames} total)</div>
                </div>`
            }

            // audio score
            if (media === 'audio') {
                html += `
                <div class="card">
                    <h3>Audio Fake Score</h3>
                    <div class="score-big" style="color:${d.score > 50 ? '#ef4444' : '#22c55e'}">${d.score?.toFixed(1)}%</div>
                    <div class="bar"><div class="bar-fill ${d.score > 50 ? 'red' : 'green'}" style="width:${d.score}%"></div></div>
                    <div style="font-size:12px;color:#888;">${d.modelUsed || 'audio detection model'}</div>
                </div>`
            }

            html += `</div>` // end grid2

            // EXIF + hash row (image)
            if (media === 'image') {
                html += `<div class="grid2">`
                html += `
                <div class="card">
                    <h3>EXIF Analysis</h3>
                    <div style="margin-bottom:8px;">
                        Status: <span class="tag ${d.exifLabel === 'CLEAN' ? 'ok' : ''}">${d.exifLabel}</span>
                    </div>
                    ${d.exifFlags?.length ? d.exifFlags.map(f => `<span class="tag">${f}</span>`).join('') : '<span class="tag ok">no issues found</span>'}
                    <div style="margin-top:8px;font-size:12px;color:#888;">EXIF score: ${d.exifScore}% · 15% weight</div>
                </div>`

                if (d.heatmapBase64) {
                    html += `
                    <div class="card">
                        <h3>ELA Heatmap</h3>
                        <img class="heatmap-img" src="data:image/png;base64,${d.heatmapBase64}" alt="ELA Heatmap" />
                        <div style="font-size:11px;color:#666;margin-top:4px;">bright = higher manipulation likelihood</div>
                    </div>`
                }
                html += `</div>`
            }

            // forensic details
            html += `
            <div class="card" style="margin-top:0">
                <h3>Forensic Details</h3>
                <div class="stat-row"><span class="stat-label">SHA-256 Hash</span><span class="stat-val" style="font-family:monospace;font-size:11px">${d.fileHash?.slice(0,32)}...</span></div>
                <div class="stat-row"><span class="stat-label">Chain Hash</span><span class="stat-val" style="font-family:monospace;font-size:11px">${d.chainHash?.slice(0,32) || '—'}...</span></div>
                <div class="stat-row"><span class="stat-label">Media Type</span><span class="stat-val">${media.toUpperCase()}</span></div>
                <div class="stat-row"><span class="stat-label">Analyzed At</span><span class="stat-val">${new Date(d.timestamp * 1000).toLocaleString()}</span></div>
            </div>`

            // action buttons
            html += `
            <div class="actions">
                <button class="btn btn-success" onclick="downloadReport()" id="reportBtn">Download PDF Report</button>
                <button class="btn btn-primary" onclick="window.location.href='index.html'">Analyze Another</button>
                <button class="btn btn-outline" onclick="copyResult()">Copy JSON</button>
            </div>
            <div id="reportStatus" style="font-size:13px;color:#aaa;margin-top:8px;"></div>
            <div class="summary-box" id="summaryBox" style="display:none"></div>`

            document.getElementById('main').innerHTML = html

            // animate bars after render
            setTimeout(() => {
                document.querySelectorAll('.bar-fill').forEach(b => {
                    const w = b.style.width; b.style.width = '0%'
                    setTimeout(() => b.style.width = w, 50)
                })
            }, 100)
        }

        async function downloadReport() {
            const d = JSON.parse(localStorage.getItem('scanResult'))
            const btn = document.getElementById('reportBtn')
            const status = document.getElementById('reportStatus')
            btn.disabled = true
            btn.textContent = 'Generating report...'
            status.textContent = 'Calling LLM for summary, please wait...'

            try {
                const res = await fetch('http://localhost:3000/api/report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...d, fileId: d.fileId })
                })
                if (!res.ok) throw new Error('Report generation failed')
                const rep = await res.json()

                // show LLM summary
                if (rep.llmSummary) {
                    const box = document.getElementById('summaryBox')
                    box.style.display = 'block'
                    box.textContent = rep.llmSummary
                }

                // download PDF
                if (rep.reportBase64) {
                    const link = document.createElement('a')
                    link.href = 'data:application/pdf;base64,' + rep.reportBase64
                    link.download = `ForensicAI-${rep.caseReference}.pdf`
                    link.click()
                    status.textContent = `Report saved: ${rep.caseReference}`
                } else if (rep.pdfUrl) {
                    window.open(rep.pdfUrl, '_blank')
                    status.textContent = `Report: ${rep.caseReference}`
                }

                btn.textContent = 'Download PDF Report'
                btn.disabled = false
            } catch(e) {
                status.textContent = 'Error: ' + e.message
                btn.textContent = 'Download PDF Report'
                btn.disabled = false
            }
        }

        function copyResult() {
            const d = localStorage.getItem('scanResult')
            navigator.clipboard.writeText(d).then(() => alert('Result copied to clipboard'))
        }
    </script>
</body>
</html>
